name: Build Safari Extension

# Runs:
# - Manually from the GitHub Actions "Run workflow" button
# - Automatically whenever files inside extension/ change
on:
  workflow_dispatch:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/build-safari-extension.yml"

jobs:
  build:
    # macOS runner with Xcode preinstalled
    runs-on: macos-14

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Show build environment
      # ------------------------------------------------------------
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --find safari-web-extension-converter


      # ------------------------------------------------------------
      # 3. Convert Safari Web Extension into an Xcode project
      # ------------------------------------------------------------
      - name: Convert web extension to Xcode project
        run: |
          rm -rf build-project

          xcrun safari-web-extension-converter extension \
            --project-location build-project \
            --app-name "DSA Stopwatch" \
            --bundle-identifier com.dsastopwatch.extension \
            --swift \
            --macos-only \
            --no-open \
            --no-prompt \
            --force


      # ------------------------------------------------------------
      # 4. Find the generated Xcode scheme
      # ------------------------------------------------------------
      - name: Find Xcode scheme
        id: scheme
        run: |
          cd build-project/"DSA Stopwatch"

          echo "=== Generated Xcode project ==="
          ls -la

          echo ""
          echo "=== Available schemes ==="

          xcodebuild -list -json

          SCHEME=$(xcodebuild -list -json | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")

          echo ""
          echo "Using scheme: $SCHEME"

          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 5. Build the macOS application
      #
      # CODE_SIGN_IDENTITY="-" means ad-hoc signing.
      #
      # We deliberately DO NOT use:
      #   CODE_SIGNING_ALLOWED=NO
      #   CODE_SIGNING_REQUIRED=NO
      #
      # because we want Xcode to actually sign the application
      # and its embedded Safari extension.
      # ------------------------------------------------------------
      - name: Build the app
        run: |
          cd build-project/"DSA Stopwatch"

          xcodebuild build \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-"


      # ------------------------------------------------------------
      # 6. Locate the generated .app
      # ------------------------------------------------------------
      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find build-project/DerivedData \
            -maxdepth 6 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found."
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 7. Inspect the application bundle
      # ------------------------------------------------------------
      - name: Inspect app bundle
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"

          echo "=================================================="
          echo "APP CONTENTS"
          echo "=================================================="

          find "$APP_PATH/Contents" -maxdepth 4 -print

          echo ""
          echo "=================================================="
          echo "APP SIGNATURE"
          echo "=================================================="

          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true

          echo ""
          echo "=================================================="
          echo "EMBEDDED EXTENSIONS"
          echo "=================================================="

          find "$APP_PATH/Contents/PlugIns" \
            -maxdepth 2 \
            -type d \
            -name "*.appex" \
            -print


      # ------------------------------------------------------------
      # 8. Verify the complete code signature
      # ------------------------------------------------------------
      - name: Verify code signatures
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"

          echo "=================================================="
          echo "VERIFYING APP"
          echo "=================================================="

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP_PATH"

          echo ""
          echo "=================================================="
          echo "VERIFYING EMBEDDED EXTENSIONS"
          echo "=================================================="

          for EXTENSION in "$APP_PATH"/Contents/PlugIns/*.appex; do
            if [ -d "$EXTENSION" ]; then
              echo ""
              echo "Verifying:"
              echo "$EXTENSION"

              codesign \
                --verify \
                --strict \
                --verbose=4 \
                "$EXTENSION"
            fi
          done

          echo ""
          echo "Code-signature verification completed successfully."


      # ------------------------------------------------------------
      # 9. Inspect Safari extension Info.plist
      # ------------------------------------------------------------
      - name: Inspect Safari extension
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"

          EXTENSION=$(find "$APP_PATH/Contents/PlugIns" \
            -maxdepth 1 \
            -type d \
            -name "*.appex" \
            | head -n 1)

          if [ -z "$EXTENSION" ]; then
            echo "ERROR: No Safari extension found."
            exit 1
          fi

          echo "Safari extension:"
          echo "$EXTENSION"

          echo ""
          echo "=================================================="
          echo "EXTENSION INFO.PLIST"
          echo "=================================================="

          plutil -p "$EXTENSION/Contents/Info.plist"

          echo ""
          echo "=================================================="
          echo "EXTENSION RESOURCES"
          echo "=================================================="

          find "$EXTENSION/Contents/Resources" \
            -maxdepth 3 \
            -type f \
            -print


      # ------------------------------------------------------------
      # 10. Check manifest.json
      # ------------------------------------------------------------
      - name: Validate manifest
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"

          MANIFEST=$(find "$APP_PATH/Contents/PlugIns" \
            -path "*/Contents/Resources/manifest.json" \
            -type f \
            | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: manifest.json was not found."
            exit 1
          fi

          echo "Found manifest:"
          echo "$MANIFEST"

          echo ""
          echo "=================================================="
          echo "MANIFEST"
          echo "=================================================="

          python3 -m json.tool "$MANIFEST"


      # ------------------------------------------------------------
      # 11. Create distributable .app archive
      # ------------------------------------------------------------
      - name: Package app
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"

          mkdir -p out

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            out/DSAStopwatch.app.zip

          echo "Created:"
          ls -lh out/DSAStopwatch.app.zip


      # ------------------------------------------------------------
      # 12. Upload the final .app
      # ------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSAStopwatch-macOS-app
          path: out/DSAStopwatch.app.zip
          retention-days: 30
